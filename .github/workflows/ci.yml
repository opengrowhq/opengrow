name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend · lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/fastapi-core/requirements.txt
      - name: Install ruff
        run: pip install ruff==0.15.22  # match services/fastapi-core/requirements.txt
      - name: Ruff check
        working-directory: services/fastapi-core
        run: ruff check --output-format=github .
      - name: Ruff format check
        working-directory: services/fastapi-core
        run: ruff format --check .

  backend-import:
    name: Backend · import + Alembic + tests
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      DEPLOYMENT_MODE: lite
      LITELLM_MODE: library
      SERVICE_NAME: ci
      OPENGROW_ENV: ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: opengrow_ci
      POSTGRES_USER: opengrow
      POSTGRES_PASSWORD: opengrow-ci-secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      MINIO_HOST: 127.0.0.1
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: opengrow
      MINIO_SECRET_KEY: opengrow-ci-minio
      JWT_SECRET: ci-jwt-secret-32-chars-minimum-length-value
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opengrow
          POSTGRES_PASSWORD: opengrow-ci-secret
          POSTGRES_DB: opengrow_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opengrow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/fastapi-core/requirements.txt
      - name: Install deps
        working-directory: services/fastapi-core
        run: pip install -r requirements.txt
      - name: Import app (settings + models must load)
        working-directory: services/fastapi-core
        run: python -c "from app import config, database; from app.models import Tenant, User, Asset, Generation; print('OK')"
      - name: Alembic upgrade head
        working-directory: services/fastapi-core
        run: alembic upgrade head
      - name: Alembic downgrade → base → upgrade (round-trip)
        working-directory: services/fastapi-core
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Unit tests (pytest)
        working-directory: services/fastapi-core
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Node gateway
  # ---------------------------------------------------------------------------
  gateway-build:
    name: Gateway · type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund --loglevel=error
      - name: TypeScript compile
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker images
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker · build ${{ matrix.service }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fastapi-core
            target: dev
          - service: fastapi-core
            target: prod
          - service: node-gateway
            target: dev
          - service: node-gateway
            target: prod
          - service: frontend
            target: dev
          - service: frontend
            target: runner
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.service }} target=${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: opengrow/${{ matrix.service }}:${{ matrix.target }}-ci
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.target }},mode=max

  # ---------------------------------------------------------------------------
  # docker-compose validation
  # ---------------------------------------------------------------------------
  compose-validate:
    name: Compose · validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lite compose parses
        run: docker compose -f docker-compose.lite.yml config >/dev/null
      - name: Base + dev overlay parses
        env:
          INFISICAL_URL: http://infisical:8080
          INFISICAL_PROJECT_ID: dev
          INFISICAL_ENVIRONMENT: dev
          INFISICAL_TOKEN: dummy
          OPENGROW_ENV: dev
          POSTGRES_HOST: postgres
          POSTGRES_PORT: '5432'
          POSTGRES_DB: opengrow
          POSTGRES_USER: opengrow
          REDIS_HOST: redis
          REDIS_PORT: '6379'
          REDIS_BROKER_DB: '0'
          REDIS_RESULT_DB: '1'
          REDIS_CACHE_DB: '2'
          QDRANT_HOST: qdrant
          QDRANT_PORT: '6333'
          MINIO_HOST: minio
          MINIO_PORT: '9000'
          MINIO_BUCKET_ASSETS: opengrow-assets
          MINIO_BUCKET_TEMP: opengrow-temp
          CLAMAV_HOST: clamav
          CLAMAV_PORT: '3310'
          OPENFGA_API_URL: http://openfga:8080
          LITELLM_URL: http://litellm:4000
          MAILPIT_HOST: mailpit
          MAILPIT_SMTP_PORT: '1025'
        run: |
          mkdir -p infra/secrets
          for f in pg_password minio_root_user minio_root_password openfga_datastore_uri \
                   infisical_encryption_key infisical_auth_secret infisical_db_uri \
                   litellm_master_key litellm_db_uri; do
            echo "ci-placeholder" > infra/secrets/$f
          done
          docker compose config >/dev/null
      - name: Base + prod overlay parses
        env:
          # same as above +
          CADDY_DOMAIN: opengrow.dev
          CADDY_EMAIL: ci@opengrow.dev
          INFISICAL_URL: http://infisical:8080
          INFISICAL_PROJECT_ID: prod
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_TOKEN: dummy
          OPENGROW_ENV: prod
          POSTGRES_HOST: postgres
          POSTGRES_PORT: '5432'
          POSTGRES_DB: opengrow
          POSTGRES_USER: opengrow
          REDIS_HOST: redis
          REDIS_PORT: '6379'
          REDIS_BROKER_DB: '0'
          REDIS_RESULT_DB: '1'
          REDIS_CACHE_DB: '2'
          QDRANT_HOST: qdrant
          QDRANT_PORT: '6333'
          MINIO_HOST: minio
          MINIO_PORT: '9000'
          MINIO_BUCKET_ASSETS: opengrow-assets
          MINIO_BUCKET_TEMP: opengrow-temp
          CLAMAV_HOST: clamav
          CLAMAV_PORT: '3310'
          OPENFGA_API_URL: http://openfga:8080
          LITELLM_URL: http://litellm:4000
          MAILPIT_HOST: mailpit
          MAILPIT_SMTP_PORT: '1025'
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null

  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security · Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy scan (report-only, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
